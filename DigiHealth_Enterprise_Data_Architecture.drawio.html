;&amp;lt;p&amp;gt;That could make the current &amp;lt;code&amp;gt;MedicalRecord&amp;lt;/code&amp;gt; structure problematic.&amp;lt;/p&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;160.073732718894\&quot; width=\&quot;293.90046882245275\&quot; x=\&quot;34.732536561317545\&quot; y=\&quot;190.085806451613\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;MAwl2OnnpyVytO2v4TgS-203\&quot; parent=\&quot;MAwl2OnnpyVytO2v4TgS-455\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;fontSize=10;movable=0;resizable=0;rotatable=0;deletable=0;editable=0;locked=1;connectable=0;\&quot; value=\&quot;&amp;lt;div style=&amp;quot;color: rgb(0, 0, 0); text-align: start; font-family: &amp;amp;quot;Segoe UI&amp;amp;quot;; font-size: 12px; line-height: 20px;&amp;quot;&amp;gt;&amp;lt;h3&amp;gt;⚠️ D. Appointment ↔ Doctor&amp;lt;/h3&amp;gt;&amp;lt;p&amp;gt;Our &amp;lt;code&amp;gt;AppointmentDoctor&amp;lt;/code&amp;gt; entity has a &amp;lt;strong&amp;gt;composite primary key&amp;lt;/strong&amp;gt;:&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;&amp;lt;code&amp;gt;(AppointmentID, DoctorID)&amp;lt;/code&amp;gt;&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;That means when we reach &amp;lt;strong&amp;gt;2NF&amp;lt;/strong&amp;gt;, this is the table where we need to be particularly careful about &amp;lt;strong&amp;gt;partial dependencies&amp;lt;/strong&amp;gt; if we add attributes such as &amp;lt;code&amp;gt;DoctorName&amp;lt;/code&amp;gt; or &amp;lt;code&amp;gt;AppointmentDate&amp;lt;/code&amp;gt;.&amp;lt;/p&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;200.09216589861748\&quot; width=\&quot;339.6307504575961\&quot; x=\&quot;1204.5893598413659\&quot; y=\&quot;870.3508986175115\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;MAwl2OnnpyVytO2v4TgS-194\&quot; parent=\&quot;MAwl2OnnpyVytO2v4TgS-455\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;rounded=0;fontSize=14;movable=0;resizable=0;rotatable=0;deletable=0;editable=0;locked=1;connectable=0;\&quot; value=\&quot;&amp;lt;div style=&amp;quot;color: rgb(0, 0, 0); font-family: &amp;amp;quot;Segoe UI&amp;amp;quot;; line-height: 100%;&amp;quot;&amp;gt;&amp;lt;h3 style=&amp;quot;line-height: 100%;&amp;quot;&amp;gt;&amp;lt;u&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px; line-height: 100%;&amp;quot;&amp;gt;⚠️ B. &amp;lt;code&amp;gt;Doctor.Specialization&amp;lt;/code&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/u&amp;gt;&amp;lt;/h3&amp;gt;&amp;lt;p&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px; line-height: 100%;&amp;quot;&amp;gt;A doctor might potentially have one or multiple specializations. The project material also refers to specialization within the broader healthcare model. &amp;lt;a href=&amp;quot;https://ibm-my.sharepoint.com/personal/romeo_ndlovu_ibm_com/Documents/Microsoft%20Copilot%20Chat%20Files/Enterprise%20Data%20Architecture%20and%20DataOps.pdf&amp;quot; style=&amp;quot;text-decoration: none; color: rgb(70, 79, 235);&amp;quot;&amp;gt;[Enterprise...ataOps.pdf | PDF]&amp;lt;/a&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px; line-height: 100%;&amp;quot;&amp;gt;We need to determine whether this is just a Doctor attribute or deserves its own entity.&amp;lt;/font&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;div style=&amp;quot;color: rgb(0, 0, 0);&amp;quot;&amp;gt;&amp;lt;u&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px; line-height: 100%;&amp;quot;&amp;gt;⚠️ Doctor&amp;lt;/font&amp;gt;&amp;lt;/u&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;color: rgb(0, 0, 0);&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px; line-height: 100%;&amp;quot;&amp;gt;If doctors can have multiple specializations, storing:&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;color: rgb(0, 0, 0);&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px; line-height: 100%;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Specialization = &amp;quot;Cardiology, Internal Medicine&amp;quot;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;color: rgb(0, 0, 0);&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px; line-height: 100%;&amp;quot;&amp;gt;This fails for 1st Normalization Form, because specializations cannot be stored as one value.&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;color: rgb(0, 0, 0);&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px; line-height: 100%;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre-wrap;&amp;quot;&amp;gt;Doctor Specialization Introduces:&amp;lt;/span&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;color: rgb(0, 0, 0);&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre-wrap; color: light-dark(rgb(0, 0, 0), rgb(237, 237, 237)); background-color: transparent;&amp;quot;&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Many : Many relationshipOne doctor can have many specializations and one &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;specialization can be shared across doctors&amp;lt;/font&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;217.30009216589858\&quot; width=\&quot;422.7103589090909\&quot; x=\&quot;1214.5096410909089\&quot; y=\&quot;517.1382027649769\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;MAwl2OnnpyVy
